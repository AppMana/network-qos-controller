[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-qos-controller"
version = "0.1.0"
description = "One NetworkQosPolicy, one kopf controller: VyOS router queues and DSCP rules, Linux node DSCP marking and queueing, and managed switch QoS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kopf>=1.38",
    "kubernetes>=31",
    "requests>=2.32",
    "urllib3>=2.2",
]

[project.urls]
Homepage = "https://github.com/AppMana/network-qos-controller"
Repository = "https://github.com/AppMana/network-qos-controller"
Issues = "https://github.com/AppMana/network-qos-controller/issues"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/network_qos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
