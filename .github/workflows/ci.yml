name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest -v
      - name: Manifests build
        run: kubectl kustomize config/default > /dev/null && kubectl kustomize config/monitoring > /dev/null
      - name: Image builds and carries its tools
        run: |
          docker build -t network-qos-controller:ci .
          docker run --rm network-qos-controller:ci sh -c 'nft --version && tc -V && python -c "import network_qos.controller, network_qos.agent"'
